name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test
        run: swift test --package-path Packages/SlideEdgeKit

      - name: Build app
        run: |
          xcodebuild \
            -project SlideEdge.xcodeproj \
            -scheme SlideEdge \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
